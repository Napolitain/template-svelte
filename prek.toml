minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "fix-byte-order-marker" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "eslint"
name = "ESLint (autofix)"
language = "system"
entry = "pnpm lint:fix"
pass_filenames = false
always_run = true
stages = ["pre-commit"]
priority = 10

[[repos.hooks]]
id = "prettier"
name = "Prettier (autofix)"
language = "system"
entry = "pnpm format"
pass_filenames = false
always_run = true
stages = ["pre-commit"]
priority = 20

[[repos.hooks]]
id = "check"
name = "Svelte + TypeScript"
language = "system"
entry = "pnpm check"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]
priority = 30

[[repos.hooks]]
id = "coverage"
name = "Vitest + coverage (min 80%)"
language = "system"
entry = "pnpm test:coverage"
pass_filenames = false
always_run = true
stages = ["pre-push"]
priority = 40

[[repos.hooks]]
id = "build"
name = "Production build"
language = "system"
entry = "pnpm build"
pass_filenames = false
always_run = true
stages = ["pre-push"]
priority = 50

[[repos.hooks]]
id = "browser"
name = "Playwright (production build)"
language = "system"
entry = "pnpm test:browser"
pass_filenames = false
always_run = true
stages = ["pre-push"]
priority = 60
